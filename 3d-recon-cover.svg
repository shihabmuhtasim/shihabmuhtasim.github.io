<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04071a"/>
      <stop offset="100%" style="stop-color:#0c1035"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#04071a;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="350" fill="url(#bg)"/>
  <rect width="600" height="350" fill="url(#glow1)"/>

  <!-- ── Left: checkerboard calibration target ── -->
  <g transform="translate(28, 50)" opacity="0.9">
    <text x="0" y="-6" font-family="monospace" font-size="7" fill="#64748b" letter-spacing="1">CALIBRATION TARGET</text>
    <!-- 6×5 checkerboard -->
    <rect x="0"  y="0"  width="18" height="18" fill="#e2e8f0"/>
    <rect x="18" y="0"  width="18" height="18" fill="#1e293b"/>
    <rect x="36" y="0"  width="18" height="18" fill="#e2e8f0"/>
    <rect x="54" y="0"  width="18" height="18" fill="#1e293b"/>
    <rect x="72" y="0"  width="18" height="18" fill="#e2e8f0"/>
    <rect x="90" y="0"  width="18" height="18" fill="#1e293b"/>

    <rect x="0"  y="18" width="18" height="18" fill="#1e293b"/>
    <rect x="18" y="18" width="18" height="18" fill="#e2e8f0"/>
    <rect x="36" y="18" width="18" height="18" fill="#1e293b"/>
    <rect x="54" y="18" width="18" height="18" fill="#e2e8f0"/>
    <rect x="72" y="18" width="18" height="18" fill="#1e293b"/>
    <rect x="90" y="18" width="18" height="18" fill="#e2e8f0"/>

    <rect x="0"  y="36" width="18" height="18" fill="#e2e8f0"/>
    <rect x="18" y="36" width="18" height="18" fill="#1e293b"/>
    <rect x="36" y="36" width="18" height="18" fill="#e2e8f0"/>
    <rect x="54" y="36" width="18" height="18" fill="#1e293b"/>
    <rect x="72" y="36" width="18" height="18" fill="#e2e8f0"/>
    <rect x="90" y="36" width="18" height="18" fill="#1e293b"/>

    <rect x="0"  y="54" width="18" height="18" fill="#1e293b"/>
    <rect x="18" y="54" width="18" height="18" fill="#e2e8f0"/>
    <rect x="36" y="54" width="18" height="18" fill="#1e293b"/>
    <rect x="54" y="54" width="18" height="18" fill="#e2e8f0"/>
    <rect x="72" y="54" width="18" height="18" fill="#1e293b"/>
    <rect x="90" y="54" width="18" height="18" fill="#e2e8f0"/>

    <rect x="0"  y="72" width="18" height="18" fill="#e2e8f0"/>
    <rect x="18" y="72" width="18" height="18" fill="#1e293b"/>
    <rect x="36" y="72" width="18" height="18" fill="#e2e8f0"/>
    <rect x="54" y="72" width="18" height="18" fill="#1e293b"/>
    <rect x="72" y="72" width="18" height="18" fill="#e2e8f0"/>
    <rect x="90" y="72" width="18" height="18" fill="#1e293b"/>

    <!-- Corner intersection dots (calibration corners) -->
    <circle cx="18" cy="18" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="36" cy="18" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="54" cy="18" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="72" cy="18" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="90" cy="18" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="18" cy="36" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="36" cy="36" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="54" cy="36" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="72" cy="36" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="90" cy="36" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="18" cy="54" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="36" cy="54" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="54" cy="54" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="72" cy="54" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="90" cy="54" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="18" cy="72" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="36" cy="72" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="54" cy="72" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="72" cy="72" r="2.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="90" cy="72" r="2.5" fill="#f59e0b" opacity="0.9"/>

    <!-- Zhang calibration label -->
    <text x="0" y="108" font-family="monospace" font-size="7.5" fill="#f59e0b" letter-spacing="0.5">Zhang's Calibration</text>
  </g>

  <!-- ── Middle: SIFT feature matching between two image views ── -->
  <g transform="translate(168, 40)">
    <text x="30" y="-6" font-family="monospace" font-size="7" fill="#64748b" letter-spacing="1">SIFT MATCHING</text>

    <!-- View 1 frame -->
    <rect x="0" y="0" width="80" height="60" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- abstract scene content view 1 -->
    <rect x="5" y="8" width="25" height="18" rx="1" fill="#1e3a5f" opacity="0.8"/>
    <rect x="35" y="5" width="40" height="25" rx="1" fill="#172554" opacity="0.7"/>
    <rect x="8" y="32" width="65" height="22" rx="1" fill="#0c1a2e" opacity="0.9"/>
    <!-- SIFT keypoints view 1 -->
    <circle cx="15" cy="17" r="3" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="15" cy="17" r="1" fill="#22d3ee"/>
    <circle cx="48" cy="12" r="3.5" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="48" cy="12" r="1.2" fill="#22d3ee"/>
    <circle cx="65" cy="24" r="2.5" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="65" cy="24" r="1" fill="#22d3ee"/>
    <circle cx="30" cy="40" r="3" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="30" cy="40" r="1" fill="#22d3ee"/>
    <circle cx="58" cy="44" r="2.5" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="58" cy="44" r="1" fill="#22d3ee"/>

    <!-- Arrow -->
    <line x1="85" y1="30" x2="110" y2="30" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="3,2"/>
    <polyline points="106,25 112,30 106,35" fill="none" stroke="#4f46e5" stroke-width="1.2"/>
    <text x="86" y="26" font-family="monospace" font-size="6" fill="#818cf8">RANSAC</text>

    <!-- View 2 frame (slightly different angle) -->
    <rect x="115" y="0" width="80" height="60" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- abstract scene content view 2 (slightly shifted) -->
    <rect x="12" y="6" width="25" height="18" rx="1" fill="#1e3a5f" opacity="0.8"/>
    <rect x="42" y="8" width="32" height="22" rx="1" fill="#172554" opacity="0.7"/>
    <rect x="6" y="35" width="65" height="20" rx="1" fill="#0c1a2e" opacity="0.9"/>
    <!-- SIFT keypoints view 2 -->
    <circle cx="22" cy="15" r="3" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="22" cy="15" r="1" fill="#22d3ee"/>
    <circle cx="52" cy="18" r="3.5" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="52" cy="18" r="1.2" fill="#22d3ee"/>
    <circle cx="70" cy="10" r="2.5" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="70" cy="10" r="1" fill="#22d3ee"/>
    <circle cx="35" cy="43" r="3" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="35" cy="43" r="1" fill="#22d3ee"/>
    <circle cx="62" cy="38" r="2.5" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="62" cy="38" r="1" fill="#22d3ee"/>

    <!-- Match lines between views -->
    <line x1="15" y1="17" x2="137" y2="15" stroke="#f59e0b" stroke-width="0.8" opacity="0.7"/>
    <line x1="48" y1="12" x2="167" y2="18" stroke="#f59e0b" stroke-width="0.8" opacity="0.7"/>
    <line x1="65" y1="24" x2="185" y2="10" stroke="#f59e0b" stroke-width="0.8" opacity="0.7"/>
    <line x1="30" y1="40" x2="150" y2="43" stroke="#f59e0b" stroke-width="0.8" opacity="0.7"/>
    <line x1="58" y1="44" x2="177" y2="38" stroke="#f59e0b" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- ── Right: 3D point cloud reconstruction ── -->
  <g transform="translate(435, 38)">
    <text x="10" y="-6" font-family="monospace" font-size="7" fill="#64748b" letter-spacing="1">3D RECONSTRUCTION</text>
    <!-- Perspective grid -->
    <g opacity="0.15" stroke="#6366f1" stroke-width="0.7">
      <line x1="75" y1="155" x2="0"  y2="90"/><line x1="75" y1="155" x2="150" y2="90"/>
      <line x1="75" y1="155" x2="0"  y2="130"/><line x1="75" y1="155" x2="150" y2="130"/>
      <line x1="0"  y1="90"  x2="150" y2="90"/><line x1="0"  y1="110" x2="150" y2="110"/>
      <line x1="0"  y1="130" x2="150" y2="130"/>
    </g>
    <!-- Point cloud (depth-colored) -->
    <!-- far: blue/violet -->
    <circle cx="60"  cy="20"  r="2.5" fill="#818cf8" opacity="0.8"/>
    <circle cx="80"  cy="15"  r="2.0" fill="#6366f1" opacity="0.75"/>
    <circle cx="100" cy="22"  r="2.2" fill="#7c3aed" opacity="0.7"/>
    <circle cx="45"  cy="28"  r="1.8" fill="#a78bfa" opacity="0.65"/>
    <circle cx="115" cy="18"  r="1.6" fill="#818cf8" opacity="0.65"/>
    <!-- mid: cyan -->
    <circle cx="35"  cy="50"  r="2.8" fill="#06b6d4" opacity="0.8"/>
    <circle cx="55"  cy="45"  r="2.5" fill="#22d3ee" opacity="0.85"/>
    <circle cx="75"  cy="40"  r="3.0" fill="#0891b2" opacity="0.85"/>
    <circle cx="95"  cy="48"  r="2.6" fill="#06b6d4" opacity="0.8"/>
    <circle cx="118" cy="42"  r="2.3" fill="#67e8f9" opacity="0.75"/>
    <circle cx="135" cy="55"  r="2.0" fill="#22d3ee" opacity="0.7"/>
    <!-- near: warm -->
    <circle cx="30"  cy="75"  r="3.2" fill="#34d399" opacity="0.85"/>
    <circle cx="55"  cy="70"  r="2.8" fill="#6ee7b7" opacity="0.8"/>
    <circle cx="80"  cy="68"  r="3.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="105" cy="72"  r="3.0" fill="#fbbf24" opacity="0.85"/>
    <circle cx="128" cy="78"  r="2.6" fill="#f97316" opacity="0.8"/>
    <!-- very near: red-orange -->
    <circle cx="50"  cy="100" r="3.5" fill="#ef4444" opacity="0.85"/>
    <circle cx="78"  cy="95"  r="3.8" fill="#f97316" opacity="0.9"/>
    <circle cx="105" cy="100" r="3.2" fill="#ef4444" opacity="0.85"/>
    <!-- Sparse scatter -->
    <circle cx="20"  cy="60"  r="1.5" fill="#06b6d4" opacity="0.5"/>
    <circle cx="140" cy="65"  r="1.2" fill="#22d3ee" opacity="0.45"/>
    <circle cx="25"  cy="88"  r="1.8" fill="#34d399" opacity="0.5"/>
    <circle cx="138" cy="90"  r="1.5" fill="#f59e0b" opacity="0.5"/>
    <!-- Camera positions (small camera icons) -->
    <g opacity="0.7">
      <rect x="2"   y="2"   width="16" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
      <circle cx="10" cy="8" r="3.5" fill="none" stroke="#fbbf24" stroke-width="1"/>
      <rect x="132" y="2"   width="16" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
      <circle cx="140" cy="8" r="3.5" fill="none" stroke="#fbbf24" stroke-width="1"/>
    </g>
    <!-- Epipolar lines suggestion -->
    <line x1="10"  y1="8"   x2="80"  y2="68" stroke="#fbbf24" stroke-width="0.6" opacity="0.3" stroke-dasharray="3,3"/>
    <line x1="140" y1="8"   x2="80"  y2="68" stroke="#fbbf24" stroke-width="0.6" opacity="0.3" stroke-dasharray="3,3"/>
  </g>

  <!-- Pipeline arrow labels -->
  <g opacity="0.5">
    <line x1="148" y1="175" x2="168" y2="175" stroke="#475569" stroke-width="1"/>
    <polyline points="163,170 170,175 163,180" fill="none" stroke="#475569" stroke-width="1"/>
    <line x1="415" y1="175" x2="435" y2="175" stroke="#475569" stroke-width="1"/>
    <polyline points="430,170 437,175 430,180" fill="none" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Tags -->
  <g transform="translate(28, 185)">
    <rect x="0"   y="0" width="48" height="15" rx="3" fill="#1e293b"/>
    <text x="24"  y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#7dd3fc">MATLAB</text>
    <rect x="54"  y="0" width="30" height="15" rx="3" fill="#1e293b"/>
    <text x="69"  y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#7dd3fc">SIFT</text>
    <rect x="90"  y="0" width="56" height="15" rx="3" fill="#1e293b"/>
    <text x="118" y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#7dd3fc">RANSAC</text>
    <rect x="152" y="0" width="70" height="15" rx="3" fill="#1e293b"/>
    <text x="187" y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#7dd3fc">Bundle Adj.</text>
    <rect x="228" y="0" width="56" height="15" rx="3" fill="#1e293b"/>
    <text x="256" y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#7dd3fc">DLT / SfM</text>
  </g>

  <!-- Title bar -->
  <rect x="0" y="210" width="600" height="140" fill="#04071a" opacity="0.85"/>
  <line x1="0" y1="211" x2="600" y2="211" stroke="#4f46e5" stroke-width="1" opacity="0.4"/>
  <text x="30" y="242" font-family="'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#e0e7ff">MULTIVIEW 3D RECONSTRUCTION</text>
  <text x="30" y="262" font-family="'Courier New', monospace" font-size="9" fill="#64748b">Zhang Calibration  ·  SIFT Matching  ·  RANSAC  ·  Bundle Adjustment  ·  Essential Matrix</text>
  <text x="30" y="282" font-family="'Courier New', monospace" font-size="9" fill="#475569">Euclidean reconstruction from uncalibrated images  ·  MATLAB pipeline</text>
  <text x="510" y="242" font-family="monospace" font-size="8" fill="#4f46e5" letter-spacing="1">CV · SfM</text>
</svg>
