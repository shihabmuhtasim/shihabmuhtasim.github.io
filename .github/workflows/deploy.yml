name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # package-lock.json was generated on macOS, so npm can omit Rollup's
      # Linux native optional package on the GitHub Actions runner.
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.40.1

      - run: npm run build

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
