name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # node_modules is tracked in this legacy repository and contains macOS
      # native binaries. Remove it so the Linux runner gets the right packages.
      - run: rm -rf node_modules && npm install

      # npm can still omit this optional package when the lockfile originated
      # on macOS (npm/cli#4828), so install the runner's Rollup binary directly.
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.40.1

      - run: npm run build

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
