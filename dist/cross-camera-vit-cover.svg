<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="reidbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="100%" style="stop-color:#0c1a2e"/>
    </linearGradient>
    <radialGradient id="centerglow" cx="50%" cy="48%" r="35%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="350" fill="url(#reidbg)"/>
  <rect width="600" height="350" fill="url(#centerglow)"/>

  <!-- ── Urban scene background suggestion ── -->
  <!-- Buildings (skyline silhouette) -->
  <rect x="0"   y="60"  width="35"  height="100" fill="#0a1628" opacity="0.7"/>
  <rect x="38"  y="80"  width="28"  height="80"  fill="#0a1628" opacity="0.6"/>
  <rect x="68"  y="50"  width="42"  height="110" fill="#0a1628" opacity="0.7"/>
  <rect x="480" y="55"  width="40"  height="105" fill="#0a1628" opacity="0.7"/>
  <rect x="523" y="72"  width="30"  height="88"  fill="#0a1628" opacity="0.6"/>
  <rect x="555" y="45"  width="45"  height="115" fill="#0a1628" opacity="0.7"/>
  <!-- Window lights in buildings -->
  <rect x="8"  y="70"  width="5" height="5" fill="#fbbf24" opacity="0.3"/>
  <rect x="18" y="70"  width="5" height="5" fill="#fbbf24" opacity="0.25"/>
  <rect x="8"  y="82"  width="5" height="5" fill="#fbbf24" opacity="0.2"/>
  <rect x="18" y="90"  width="5" height="5" fill="#fbbf24" opacity="0.3"/>
  <rect x="485" y="65" width="5" height="5" fill="#fbbf24" opacity="0.3"/>
  <rect x="497" y="65" width="5" height="5" fill="#fbbf24" opacity="0.25"/>
  <rect x="560" y="55" width="5" height="5" fill="#fbbf24" opacity="0.3"/>
  <rect x="572" y="70" width="5" height="5" fill="#fbbf24" opacity="0.25"/>
  <!-- Road -->
  <rect x="0" y="160" width="600" height="25" fill="#0d1117" opacity="0.9"/>
  <rect x="0" y="163" width="600" height="2" fill="#374151" opacity="0.5"/>
  <rect x="0" y="182" width="600" height="2" fill="#374151" opacity="0.5"/>
  <!-- Road dashes -->
  <rect x="80"  y="170" width="30" height="3" fill="#475569" opacity="0.5"/>
  <rect x="160" y="170" width="30" height="3" fill="#475569" opacity="0.5"/>
  <rect x="240" y="170" width="30" height="3" fill="#475569" opacity="0.5"/>
  <rect x="320" y="170" width="30" height="3" fill="#475569" opacity="0.5"/>
  <rect x="400" y="170" width="30" height="3" fill="#475569" opacity="0.5"/>
  <rect x="480" y="170" width="30" height="3" fill="#475569" opacity="0.5"/>

  <!-- ── Camera 1 (top-left pole) ── -->
  <g transform="translate(90, 30)">
    <!-- Pole -->
    <line x1="15" y1="60" x2="15" y2="145" stroke="#374151" stroke-width="3"/>
    <!-- Camera housing -->
    <rect x="0" y="42" width="30" height="20" rx="3" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="22" cy="52" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="22" cy="52" r="2.5" fill="#0ea5e9" opacity="0.7"/>
    <rect x="0" y="38" width="10" height="6" rx="1" fill="#334155"/>
    <text x="15" y="35" text-anchor="middle" font-family="monospace" font-size="7" fill="#38bdf8">CAM-1</text>
    <!-- FOV cone -->
    <line x1="22" y1="57" x2="80"  y2="155" stroke="#0ea5e9" stroke-width="0.7" opacity="0.3" stroke-dasharray="3,3"/>
    <line x1="22" y1="57" x2="150" y2="158" stroke="#0ea5e9" stroke-width="0.7" opacity="0.3" stroke-dasharray="3,3"/>
  </g>

  <!-- ── Camera 2 (top-right pole) ── -->
  <g transform="translate(480, 30)">
    <line x1="15" y1="60" x2="15" y2="145" stroke="#374151" stroke-width="3"/>
    <rect x="0" y="42" width="30" height="20" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="8"  cy="52" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="8"  cy="52" r="2.5" fill="#f59e0b" opacity="0.7"/>
    <rect x="20" y="38" width="10" height="6" rx="1" fill="#334155"/>
    <text x="15" y="35" text-anchor="middle" font-family="monospace" font-size="7" fill="#fbbf24">CAM-2</text>
    <!-- FOV cone -->
    <line x1="8" y1="57" x2="-80" y2="155" stroke="#f59e0b" stroke-width="0.7" opacity="0.3" stroke-dasharray="3,3"/>
    <line x1="8" y1="57" x2="-150" y2="158" stroke="#f59e0b" stroke-width="0.7" opacity="0.3" stroke-dasharray="3,3"/>
  </g>

  <!-- Urban objects on road -->
  <!-- Object A (urban element detected in CAM-1) -->
  <g transform="translate(160, 130)">
    <rect x="0" y="0" width="36" height="24" rx="2" fill="#1d4ed8" opacity="0.85"/>
    <rect x="3" y="3" width="10" height="8" rx="1" fill="#60a5fa" opacity="0.7"/>
    <rect x="16" y="3" width="16" height="8" rx="1" fill="#60a5fa" opacity="0.7"/>
    <rect x="3" y="14" width="8" height="8" rx="1" fill="#1e3a5f"/>
    <rect x="25" y="14" width="8" height="8" rx="1" fill="#1e3a5f"/>
    <!-- Detection box -->
    <rect x="-4" y="-4" width="44" height="32" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- ID label -->
    <rect x="0" y="-16" width="36" height="11" rx="2" fill="#0c4a6e" opacity="0.9"/>
    <text x="18" y="-7" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#7dd3fc">OBJ#142</text>
  </g>

  <!-- Same Object A in CAM-2 (re-identified) -->
  <g transform="translate(400, 128)">
    <rect x="0" y="0" width="36" height="26" rx="2" fill="#1d4ed8" opacity="0.75"/>
    <rect x="3" y="3" width="10" height="9" rx="1" fill="#60a5fa" opacity="0.65"/>
    <rect x="16" y="3" width="16" height="9" rx="1" fill="#60a5fa" opacity="0.65"/>
    <rect x="3" y="15" width="8" height="9" rx="1" fill="#1e3a5f"/>
    <rect x="25" y="15" width="8" height="9" rx="1" fill="#1e3a5f"/>
    <!-- Detection box (orange - different camera) -->
    <rect x="-4" y="-4" width="44" height="34" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- Re-ID match label -->
    <rect x="0" y="-16" width="42" height="11" rx="2" fill="#713f12" opacity="0.9"/>
    <text x="21" y="-7" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#fde68a">MATCH ✓ #142</text>
  </g>

  <!-- ── Part-Aware Transformer (center) ── -->
  <g transform="translate(232, 32)">
    <text x="68" y="-8" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b" letter-spacing="1.5">PART-AWARE TRANSFORMER</text>

    <!-- Feature extractor box -->
    <rect x="0" y="0" width="136" height="105" rx="5" fill="#0f1b2d" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="68" y="15" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#7dd3fc" font-weight="bold">Part-Aware Encoder</text>
    <line x1="10" y1="20" x2="126" y2="20" stroke="#164e63" stroke-width="0.8"/>

    <!-- Patch grid with part labels -->
    <g transform="translate(10, 26)">
      <!-- Head region (top patches, slightly brighter) -->
      <rect x="20" y="0" width="14" height="12" rx="1" fill="#0369a1" opacity="0.85"/>
      <rect x="36" y="0" width="14" height="12" rx="1" fill="#0369a1" opacity="0.85"/>
      <rect x="52" y="0" width="14" height="12" rx="1" fill="#0369a1" opacity="0.85"/>
      <rect x="68" y="0" width="14" height="12" rx="1" fill="#0369a1" opacity="0.85"/>
      <text x="56" y="8" text-anchor="middle" font-family="monospace" font-size="5" fill="#7dd3fc">HEAD</text>

      <!-- Torso region (mid patches, highlighted) -->
      <rect x="8"  y="15" width="14" height="14" rx="1" fill="#1d4ed8" opacity="0.9"/>
      <rect x="24" y="15" width="14" height="14" rx="1" fill="#2563eb" opacity="0.95"/>
      <rect x="40" y="15" width="14" height="14" rx="1" fill="#2563eb" opacity="0.95"/>
      <rect x="56" y="15" width="14" height="14" rx="1" fill="#2563eb" opacity="0.95"/>
      <rect x="72" y="15" width="14" height="14" rx="1" fill="#2563eb" opacity="0.95"/>
      <rect x="88" y="15" width="14" height="14" rx="1" fill="#1d4ed8" opacity="0.9"/>
      <text x="56" y="25" text-anchor="middle" font-family="monospace" font-size="5" fill="#bfdbfe">TORSO</text>

      <!-- Leg region (bottom patches) -->
      <rect x="14" y="33" width="14" height="12" rx="1" fill="#0c4a6e" opacity="0.8"/>
      <rect x="30" y="33" width="14" height="12" rx="1" fill="#0c4a6e" opacity="0.8"/>
      <rect x="46" y="33" width="14" height="12" rx="1" fill="#0c4a6e" opacity="0.8"/>
      <rect x="62" y="33" width="14" height="12" rx="1" fill="#0c4a6e" opacity="0.8"/>
      <rect x="78" y="33" width="14" height="12" rx="1" fill="#0c4a6e" opacity="0.8"/>
      <text x="56" y="42" text-anchor="middle" font-family="monospace" font-size="5" fill="#38bdf8">LEGS</text>
    </g>

    <!-- Attention pooling arrow -->
    <text x="68" y="85" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">↓ attention pool</text>

    <!-- Feature vector out -->
    <g transform="translate(18, 90)">
      <rect x="0"  y="0" width="10" height="10" rx="1" fill="#0ea5e9" opacity="0.9"/>
      <rect x="12" y="0" width="10" height="10" rx="1" fill="#0284c7" opacity="0.85"/>
      <rect x="24" y="0" width="10" height="10" rx="1" fill="#38bdf8" opacity="0.95"/>
      <rect x="36" y="0" width="10" height="10" rx="1" fill="#0ea5e9" opacity="0.9"/>
      <rect x="48" y="0" width="10" height="10" rx="1" fill="#0369a1" opacity="0.8"/>
      <rect x="60" y="0" width="10" height="10" rx="1" fill="#0284c7" opacity="0.85"/>
      <rect x="72" y="0" width="10" height="10" rx="1" fill="#38bdf8" opacity="0.9"/>
      <rect x="84" y="0" width="10" height="10" rx="1" fill="#0ea5e9" opacity="0.85"/>
      <rect x="96" y="0" width="10" height="10" rx="1" fill="#0369a1" opacity="0.8"/>
      <text x="50" y="20" text-anchor="middle" font-family="monospace" font-size="6" fill="#64748b">d-dim feature vector</text>
    </g>
  </g>

  <!-- Connection lines: objects to transformer -->
  <line x1="196" y1="142" x2="235" y2="90"  stroke="#38bdf8" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="418" y1="142" x2="368" y2="90"  stroke="#fbbf24" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>

  <!-- mAP metric badge -->
  <rect x="225" y="195" width="150" height="40" rx="5" fill="#0f2d3d" stroke="#0ea5e9" stroke-width="1" opacity="0.9"/>
  <text x="300" y="212" text-anchor="middle" font-family="monospace" font-size="8" fill="#7dd3fc" font-weight="bold">mAP@100: 0.15884</text>
  <text x="300" y="228" text-anchor="middle" font-family="monospace" font-size="7" fill="#34d399">+54.7% over baseline</text>

  <!-- Top-10 leaderboard badge -->
  <rect x="390" y="197" width="90" height="36" rx="4" fill="#1c1400" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
  <text x="435" y="213" text-anchor="middle" font-family="monospace" font-size="8" fill="#fbbf24" font-weight="bold">TOP 10</text>
  <text x="435" y="227" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#fde68a">Leaderboard</text>

  <!-- Title bar -->
  <rect x="0" y="248" width="600" height="102" fill="#030712" opacity="0.92"/>
  <line x1="0" y1="249" x2="600" y2="249" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
  <text x="30" y="275" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">CROSS-CAMERA RE-IDENTIFICATION</text>
  <text x="30" y="292" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">ON URBAN ELEMENTS</text>
  <text x="30" y="310" font-family="'Courier New', monospace" font-size="8.5" fill="#475569">Kaggle UAM ReID Challenge  ·  Part-Aware Transformer  ·  Camera-Adversarial Training  ·  Ensemble</text>
  <text x="505" y="275" font-family="monospace" font-size="9" fill="#0ea5e9" letter-spacing="1">CV · ReID</text>
</svg>
